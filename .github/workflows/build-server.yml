name: Build Server

on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/build-server.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: write

env:
  SDL_REF: release-3.4.10

jobs:
  build-pi-server:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install ARM Cross-Compiler and deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14-aarch64-linux-gnu g++-14-aarch64-linux-gnu cmake ninja-build git wget xxd

      - name: Cache SDL3 aarch64 static
        id: cache-sdl3-aarch64
        uses: actions/cache@v5
        with:
          path: ~/.local/sdl3-aarch64-static
          key: sdl3-aarch64-static-${{ env.SDL_REF }}-console-v2
          restore-keys: |
            sdl3-aarch64-static-${{ env.SDL_REF }}-console-
            sdl3-aarch64-static-${{ env.SDL_REF }}-

      - name: Build SDL3 aarch64 static
        if: steps.cache-sdl3-aarch64.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$SDL_REF" https://github.com/libsdl-org/SDL.git /tmp/SDL3

          cmake -S /tmp/SDL3 -B /tmp/SDL3-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc-14 \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++-14 \
            -DCMAKE_INSTALL_PREFIX="$HOME/.local/sdl3-aarch64-static" \
            -DSDL_INSTALL=ON \
            -DSDL_SHARED=OFF \
            -DSDL_STATIC=ON \
            -DSDL_TEST_LIBRARY=OFF \
            -DSDL_TESTS=OFF \
            -DSDL_EXAMPLES=OFF \
            -DSDL_UNIX_CONSOLE_BUILD=ON \
            -DSDL_AUDIO=OFF \
            -DSDL_VIDEO=OFF \
            -DSDL_RENDER=OFF \
            -DSDL_GPU=OFF \
            -DSDL_CAMERA=OFF \
            -DSDL_DIALOG=OFF \
            -DSDL_TRAY=OFF \
            -DSDL_JOYSTICK=ON \
            -DSDL_HAPTIC=ON \
            -DSDL_HIDAPI=ON \
            -DSDL_SENSOR=ON \
            -DSDL_POWER=ON

          cmake --build /tmp/SDL3-build --parallel
          cmake --install /tmp/SDL3-build

      - name: Cross-compile miniupnpc for aarch64
        run: |
          wget -q https://github.com/miniupnp/miniupnp/archive/refs/tags/miniupnpc_2_2_8.tar.gz
          tar xzf miniupnpc_2_2_8.tar.gz

          cd miniupnp-miniupnpc_2_2_8/miniupnpc
          mkdir build
          cd build

          cmake .. \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc-14 \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++-14 \
            -DCMAKE_INSTALL_PREFIX=/tmp/miniupnpc \
            -DBUILD_SHARED_LIBS=OFF

          make -j"$(nproc)"
          make install

      - name: Cache OpenSSL aarch64
        id: cache-openssl-aarch64
        uses: actions/cache@v4
        with:
          path: /tmp/openssl
          key: openssl-aarch64-3.0.13-v1

      - name: Cross-compile OpenSSL for aarch64
        if: steps.cache-openssl-aarch64.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/openssl/openssl/releases/download/openssl-3.0.13/openssl-3.0.13.tar.gz
          tar xzf openssl-3.0.13.tar.gz
          cd openssl-3.0.13
          CC=aarch64-linux-gnu-gcc-14 CXX=aarch64-linux-gnu-g++-14 ./Configure linux-aarch64 --cross-compile-prefix=aarch64-linux-gnu- --prefix=/tmp/openssl
          make -j"$(nproc)"
          make install

      - name: Cache libwebsockets aarch64
        id: cache-lws-aarch64
        uses: actions/cache@v4
        with:
          path: /tmp/libwebsockets
          key: lws-aarch64-4.3.3-v1

      - name: Cross-compile libwebsockets for aarch64
        if: steps.cache-lws-aarch64.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/warmcat/libwebsockets/archive/refs/tags/v4.3.3.tar.gz
          tar xzf v4.3.3.tar.gz
          cd libwebsockets-4.3.3
          mkdir build && cd build
          cmake .. \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc-14 \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++-14 \
            -DCMAKE_INSTALL_PREFIX=/tmp/libwebsockets \
            -DLWS_WITH_SSL=ON \
            -DOPENSSL_ROOT_DIR=/tmp/openssl \
            -DLWS_WITHOUT_TESTAPPS=ON
          make -j"$(nproc)"
          make install

      - name: Build Unified Pi Server
        run: |
          cd server
          mkdir -p build
          cd build

          cmake .. \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++-14 \
            -DCMAKE_PREFIX_PATH="$HOME/.local/sdl3-aarch64-static" \
            -DUSE_SDL_BT=ON \
            -DREQUIRE_SDL_BT=ON \
            -DMINIUPNPC_INCLUDE_DIRS=/tmp/miniupnpc/include \
            -DMINIUPNPC_LIBRARIES=/tmp/miniupnpc/lib/libminiupnpc.a \
            -DOPENSSL_ROOT_DIR=/tmp/openssl \
            -Dlibwebsockets_DIR=/tmp/libwebsockets/lib/cmake/libwebsockets

          make -j"$(nproc)"

          mkdir -p artifact/pi-server
          cp ns-backend artifact/pi-server/ns-backend

      - uses: actions/upload-artifact@v6
        with:
          name: pi-server
          path: server/build/artifact/pi-server/