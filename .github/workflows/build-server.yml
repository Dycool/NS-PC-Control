name: Build Server

on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/build-server.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: write

env:
  SDL_REF: release-3.4.10
  BLUEZ_VERSION: "5.72"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-pi-server:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 cmake ninja-build git wget xxd \
            libssl-dev libwebsockets-dev libminiupnpc-dev libsystemd-dev pkg-config \
            libglib2.0-dev libdbus-1-dev libudev-dev libreadline-dev \
            python3-docutils

      - name: Cache SDL3 aarch64 static
        id: cache-sdl3-aarch64
        uses: actions/cache@v5
        with:
          path: ~/.local/sdl3-aarch64-static
          key: sdl3-aarch64-static-${{ env.SDL_REF }}-console-v3
          restore-keys: |
            sdl3-aarch64-static-${{ env.SDL_REF }}-console-
            sdl3-aarch64-static-${{ env.SDL_REF }}-

      - name: Build SDL3 aarch64 static
        if: steps.cache-sdl3-aarch64.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$SDL_REF" https://github.com/libsdl-org/SDL.git /tmp/SDL3

          cmake -S /tmp/SDL3 -B /tmp/SDL3-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_INSTALL_PREFIX="$HOME/.local/sdl3-aarch64-static" \
            -DSDL_INSTALL=ON \
            -DSDL_SHARED=OFF \
            -DSDL_STATIC=ON \
            -DSDL_TEST_LIBRARY=OFF \
            -DSDL_TESTS=OFF \
            -DSDL_EXAMPLES=OFF \
            -DSDL_UNIX_CONSOLE_BUILD=ON \
            -DSDL_AUDIO=OFF \
            -DSDL_VIDEO=OFF \
            -DSDL_RENDER=OFF \
            -DSDL_GPU=OFF \
            -DSDL_CAMERA=OFF \
            -DSDL_DIALOG=OFF \
            -DSDL_TRAY=OFF \
            -DSDL_JOYSTICK=ON \
            -DSDL_HAPTIC=ON \
            -DSDL_HIDAPI=ON \
            -DSDL_SENSOR=ON \
            -DSDL_POWER=ON

          cmake --build /tmp/SDL3-build --parallel
          cmake --install /tmp/SDL3-build

      - name: Cache bundled bluetoothd
        id: cache-bluez
        uses: actions/cache@v5
        with:
          path: ~/.local/bluez-${{ env.BLUEZ_VERSION }}
          key: bluez-${{ env.BLUEZ_VERSION }}-arm64-v1

      - name: Build bundled bluetoothd (BlueZ ${{ env.BLUEZ_VERSION }})
        if: steps.cache-bluez.outputs.cache-hit != 'true'
        run: |
          wget -q "https://www.kernel.org/pub/linux/bluetooth/bluez-${BLUEZ_VERSION}.tar.xz"
          tar xf "bluez-${BLUEZ_VERSION}.tar.xz"
          cd "bluez-${BLUEZ_VERSION}"

          ./configure \
            --prefix="$HOME/.local/bluez-${BLUEZ_VERSION}" \
            --disable-systemd \
            --disable-udev \
            --disable-cups \
            --disable-obex \
            --disable-client \
            --disable-mesh \
            --disable-monitor \
            --disable-tools \
            --disable-health \
            --disable-hid \
            --disable-hog \
            --disable-a2dp \
            --disable-avrcp \
            --disable-network

          make -j"$(nproc)"
          mkdir -p "$HOME/.local/bluez-${BLUEZ_VERSION}/libexec/bluetooth"
          cp src/bluetoothd "$HOME/.local/bluez-${BLUEZ_VERSION}/libexec/bluetooth/bluetoothd"

      - name: Build Unified Pi Server
        run: |
          cd server
          mkdir -p build
          cd build

          cmake .. \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_PREFIX_PATH="$HOME/.local/sdl3-aarch64-static" \
            -DUSE_SDL_BT=ON \
            -DREQUIRE_SDL_BT=ON \
            -DBUNDLE_BLUETOOTHD=ON \
            -DBUNDLED_BLUETOOTHD_PATH="$HOME/.local/bluez-${BLUEZ_VERSION}/libexec/bluetooth/bluetoothd"

          make -j"$(nproc)"

          mkdir -p artifact/pi-server
          cp ns-backend artifact/pi-server/ns-backend

      - uses: actions/upload-artifact@v6
        with:
          name: pi-server
          path: server/build/artifact/pi-server/