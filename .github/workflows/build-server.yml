name: Build Server

on:
  push:
    paths:
      - 'server/**'
      - 'shared/**'
      - 'webapp/**'
      - 'scripts/**'
      - '.github/actions/update-amiibo-catalog/**'
      - '.github/workflows/build-server.yml'
  schedule:
    # Keep the embedded module catalog current as Raspberry Pi OS publishes
    # new kernels, even when the application source has not changed.
    - cron: '23 4 * * 1'
  workflow_dispatch:
  workflow_call:
    secrets:
      AMIIBO_RETAIL_KEY_B64:
        description: Build-only base64 encoding of the 160-byte amiitool retail key
        required: true

permissions:
  contents: read
  actions: write

env:
  SDL_REF: release-3.4.10
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Refresh the offline Amiibo catalogue
        uses: ./.github/actions/update-amiibo-catalog

      - name: Check embedded web JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find webapp/js -type f -name '*.js' -print0)

  build-raw-gadget-modules:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        suite: [bookworm, trixie]
    container: debian:${{ matrix.suite }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Raspberry Pi kernel headers
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y ca-certificates curl gnupg gcc make libc6-dev kmod
          # Raspberry Pi Foundation's apt signing key still carries a SHA-1
          # binding signature. Debian trixie's sqv backend hard-rejects those
          # since 2026-02-01, breaking `apt-get update` for this repo only
          # (present since our first trixie run; bookworm's older apt has no
          # sqv config and is unaffected). Extend apt's own documented
          # grace-period knob for legacy repos rather than disabling signature
          # verification outright (`trusted=yes`) for the source. Remove this
          # once Raspberry Pi re-signs their key with a modern hash.
          if [ -f /usr/share/apt/default-sequoia.config ]; then
            mkdir -p /etc/crypto-policies/back-ends
            sed 's/^sha1\.second_preimage_resistance = .*/sha1.second_preimage_resistance = 2027-07-01    # TODO: remove once archive.raspberrypi.com re-signs with a non-SHA1 key/' \
              /usr/share/apt/default-sequoia.config \
              > /etc/crypto-policies/back-ends/apt-sequoia.config
          fi
          curl -fsSL https://archive.raspberrypi.com/debian/raspberrypi.gpg.key \
            | gpg --dearmor -o /usr/share/keyrings/raspberrypi-archive-keyring.gpg
          echo 'deb [arch=arm64 signed-by=/usr/share/keyrings/raspberrypi-archive-keyring.gpg] https://archive.raspberrypi.com/debian/ ${{ matrix.suite }} main' \
            > /etc/apt/sources.list.d/raspberrypi.list
          apt-get update
          apt-get install -y linux-headers-rpi-v8 linux-headers-rpi-2712

      - name: Identify current Raspberry Pi kernel releases
        id: kernels
        shell: bash
        run: |
          set -euo pipefail
          releases="$({
            find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-rpi-v8' -printf '%f\n'
            find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-rpi-2712' -printf '%f\n'
          } | sed 's/^linux-headers-//' | sort -u | paste -sd_ -)"
          if [ -z "$releases" ]; then
            echo "No Raspberry Pi kernel header trees were installed"
            exit 1
          fi
          echo "releases=$releases" >> "$GITHUB_OUTPUT"

      - name: Restore previously supported Raw Gadget modules
        uses: actions/cache@v5
        with:
          path: server/prebuilt-raw-gadget
          key: raw-gadget-modules-${{ matrix.suite }}-${{ steps.kernels.outputs.releases }}-${{ hashFiles('server/kernel/raw_gadget.c') }}-v2
          restore-keys: |
            raw-gadget-modules-${{ matrix.suite }}-

      - name: Build Raw Gadget for current Raspberry Pi kernels
        shell: bash
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/server/prebuilt-raw-gadget"
          mkdir -p "$output"

          found=0
          for kernel_dir in /usr/src/linux-headers-*-rpi-v8 /usr/src/linux-headers-*-rpi-2712; do
            [ -d "$kernel_dir" ] || continue
            release="${kernel_dir#/usr/src/linux-headers-}"
            build_dir="$(mktemp -d)"
            cp server/kernel/raw_gadget.c "$build_dir/raw_gadget.c"
            printf 'obj-m += raw_gadget.o\n' > "$build_dir/Makefile"
            make -C "$kernel_dir" M="$build_dir" modules
            cp "$build_dir/raw_gadget.ko" "$output/raw_gadget-$release.ko"
            rm -rf "$build_dir"
            found=$((found + 1))
          done

          if [ "$found" -lt 2 ]; then
            echo "Expected both Raspberry Pi v8 and 2712 kernel headers"
            find /usr/src -maxdepth 1 -type d -name 'linux-headers-*' -print
            exit 1
          fi

          # Retain a useful update window without allowing the single server
          # binary to grow forever. Each OS suite keeps its four newest exact
          # kernel releases for both supported Raspberry Pi kernel profiles.
          for profile in rpi-v8 rpi-2712; do
            mapfile -t modules < <(
              find "$output" -maxdepth 1 -type f -name "raw_gadget-*-$profile.ko" -print | sort -V
            )
            while [ "${#modules[@]}" -gt 4 ]; do
              rm -f "${modules[0]}"
              modules=("${modules[@]:1}")
            done
          done

      - uses: actions/upload-artifact@v6
        with:
          name: raw-gadget-modules-${{ matrix.suite }}
          path: server/prebuilt-raw-gadget/*.ko

  build-pi-server:
    needs: build-raw-gadget-modules
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v6

      - name: Download precompiled Raw Gadget modules
        uses: actions/download-artifact@v7
        with:
          pattern: raw-gadget-modules-*
          merge-multiple: true
          path: server/prebuilt-raw-gadget

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 cmake ninja-build git wget curl xxd \
            libssl-dev libwebsockets-dev libminiupnpc-dev libsystemd-dev \
            linux-libc-dev pkg-config

          test -f /usr/include/linux/usb/raw_gadget.h

      - name: Refresh the offline Amiibo catalogue
        uses: ./.github/actions/update-amiibo-catalog

      - name: Cache SDL3 aarch64 static
        id: cache-sdl3-aarch64
        uses: actions/cache@v5
        with:
          path: ~/.local/sdl3-aarch64-static
          key: sdl3-aarch64-static-${{ env.SDL_REF }}-console-v3
          restore-keys: |
            sdl3-aarch64-static-${{ env.SDL_REF }}-console-
            sdl3-aarch64-static-${{ env.SDL_REF }}-

      - name: Build SDL3 aarch64 static
        if: steps.cache-sdl3-aarch64.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$SDL_REF" https://github.com/libsdl-org/SDL.git /tmp/SDL3

          cmake -S /tmp/SDL3 -B /tmp/SDL3-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_INSTALL_PREFIX="$HOME/.local/sdl3-aarch64-static" \
            -DSDL_INSTALL=ON \
            -DSDL_SHARED=OFF \
            -DSDL_STATIC=ON \
            -DSDL_TEST_LIBRARY=OFF \
            -DSDL_TESTS=OFF \
            -DSDL_EXAMPLES=OFF \
            -DSDL_UNIX_CONSOLE_BUILD=ON \
            -DSDL_AUDIO=OFF \
            -DSDL_VIDEO=OFF \
            -DSDL_RENDER=OFF \
            -DSDL_GPU=OFF \
            -DSDL_CAMERA=OFF \
            -DSDL_DIALOG=OFF \
            -DSDL_TRAY=OFF \
            -DSDL_JOYSTICK=ON \
            -DSDL_HAPTIC=ON \
            -DSDL_HIDAPI=ON \
            -DSDL_SENSOR=ON \
            -DSDL_POWER=ON

          cmake --build /tmp/SDL3-build --parallel
          cmake --install /tmp/SDL3-build

      - name: Build Unified Pi Server
        env:
          AMIIBO_RETAIL_KEY_B64: ${{ secrets.AMIIBO_RETAIL_KEY_B64 }}
        run: |
          set -euo pipefail
          cd server
          mkdir -p build
          cd build

          cmake .. \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_PREFIX_PATH="$HOME/.local/sdl3-aarch64-static" \
            -DRAW_GADGET_MODULE_DIR="$GITHUB_WORKSPACE/server/prebuilt-raw-gadget" \
            -DUSE_SDL_BT=ON \
            -DREQUIRE_SDL_BT=ON

          cmake --build . --target amiibo-bundle-generator --parallel

          if [ -z "${AMIIBO_RETAIL_KEY_B64:-}" ]; then
            echo "::error::Configure the AMIIBO_RETAIL_KEY_B64 repository secret so every distributed server contains its offline Amiibo templates."
            exit 1
          fi

          build_key="$(mktemp)"
          trap 'rm -f "$build_key"' EXIT
          printf '%s' "$AMIIBO_RETAIL_KEY_B64" | base64 --decode > "$build_key"
          if [ "$(stat -c %s "$build_key")" -ne 160 ]; then
            echo "AMIIBO_RETAIL_KEY_B64 must decode to exactly 160 bytes"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/server/generated"
          ./amiibo-bundle-generator \
            "$GITHUB_WORKSPACE/shared/data/amiibo_catalog.json" \
            "$build_key" \
            "$GITHUB_WORKSPACE/server/generated/amiibo_templates.bin"
          rm -f "$build_key"
          trap - EXIT

          # The first configure creates the generator. Reconfigure after its
          # output exists so the release backend embeds the generated bundle.
          cmake .. \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_PREFIX_PATH="$HOME/.local/sdl3-aarch64-static" \
            -DRAW_GADGET_MODULE_DIR="$GITHUB_WORKSPACE/server/prebuilt-raw-gadget" \
            -DAMIIBO_TEMPLATE_BUNDLE="$GITHUB_WORKSPACE/server/generated/amiibo_templates.bin" \
            -DUSE_SDL_BT=ON \
            -DREQUIRE_SDL_BT=ON

          make -j"$(nproc)"

          mkdir -p artifact/pi-server
          cp ns-backend artifact/pi-server/ns-backend

      - uses: actions/upload-artifact@v6
        with:
          name: pi-server
          path: server/build/artifact/pi-server/
