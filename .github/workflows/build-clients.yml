name: Build Clients

on:
  push:
    paths:
      - 'client/**'
      - 'shared/**'
      - 'server/include/**'
      - 'server/src/shared/**'
      - 'scripts/**'
      - '.github/actions/update-amiibo-catalog/**'
      - '.github/workflows/build-clients.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: write

env:
  SDL_REF: release-3.4.10
  QT_VERSION: '6.8.3'
  VCPKG_COMMIT: 9d7f79f56ae1a9b4704d6a7fb8237e347a974133
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/_cache/vcpkg-bincache
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Windows static .exe
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      VCPKG_ROOT: ${{ github.workspace }}/_deps/vcpkg
    steps:
      - uses: actions/checkout@v6

      - name: Setup MSVC
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Refresh the offline Amiibo catalogue
        uses: ./.github/actions/update-amiibo-catalog

      - name: Capture MSVC toolset version for cache key
        id: msvc
        shell: pwsh
        run: |
          $ver = $env:VCToolsVersion
          if (-not $ver) {
            $out = (& cl.exe 2>&1 | Out-String)
            if ($out -match 'Version ([\d\.]+)') { $ver = $Matches[1] }
          }
          if (-not $ver) { $ver = 'unknown' }
          Write-Host "MSVC toolset version: $ver"
          "ver=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore vcpkg binary cache
        uses: actions/cache@v5
        with:
          path: _cache/vcpkg-bincache
          key: vcpkg-windows-static-qtbase-core-widgets-png-network-sdl3-host-release-${{ env.QT_VERSION }}-${{ env.SDL_REF }}-${{ env.VCPKG_COMMIT }}-msvc${{ steps.msvc.outputs.ver }}-v4
          restore-keys: |
            vcpkg-windows-static-qtbase-core-widgets-png-network-sdl3-host-release-${{ env.QT_VERSION }}-${{ env.SDL_REF }}-${{ env.VCPKG_COMMIT }}-msvc${{ steps.msvc.outputs.ver }}-

      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git clone https://github.com/microsoft/vcpkg.git _deps/vcpkg
          git -C _deps/vcpkg checkout --detach $env:VCPKG_COMMIT
          .\_deps\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Create release-only vcpkg triplets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force triplets | Out-Null

          @'
          set(VCPKG_TARGET_ARCHITECTURE x64)
          set(VCPKG_CRT_LINKAGE static)
          set(VCPKG_LIBRARY_LINKAGE static)
          set(VCPKG_BUILD_TYPE release)
          '@ | Set-Content triplets/x64-windows-static-release.cmake

          @'
          set(VCPKG_TARGET_ARCHITECTURE x64)
          set(VCPKG_CRT_LINKAGE dynamic)
          set(VCPKG_LIBRARY_LINKAGE dynamic)
          set(VCPKG_BUILD_TYPE release)
          '@ | Set-Content triplets/x64-windows-release.cmake

      - name: Build static Qt + SDL3 with vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $env:VCPKG_BINARY_SOURCES = "clear;files,$env:VCPKG_DEFAULT_BINARY_CACHE,readwrite"

          .\_deps\vcpkg\vcpkg.exe install `
            "qtbase[core,widgets,png,network]:x64-windows-static-release" `
            "sdl3:x64-windows-static-release" `
            "openssl:x64-windows-static-release" `
            --overlay-triplets="$PWD/triplets" `
            --host-triplet=x64-windows-release `
            --clean-after-build

      - name: Build client
        shell: pwsh
        run: |
          $env:VCPKG_BINARY_SOURCES = "clear;files,$env:VCPKG_DEFAULT_BINARY_CACHE,readwrite"

          cmake -S client -B client/build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$PWD/_deps/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-release `
            -DVCPKG_HOST_TRIPLET=x64-windows-release `
            -DQT_NO_QTPATHS_DEPLOYMENT_WARNING=ON `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

          cmake --build client/build --target ns-client --parallel

      - name: Stage Windows artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force client/artifacts/windows | Out-Null
          Copy-Item client/build/ns-client.exe client/artifacts/windows/ns-client.exe

      - uses: actions/upload-artifact@v6
        with:
          name: windows-static-exe
          path: client/artifacts/windows/ns-client.exe

  build-linux:
    name: Linux single AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 \
            build-essential cmake ninja-build pkg-config git file wget curl desktop-file-utils patchelf libssl-dev \
            qt6-base-dev qt6-base-dev-tools qt6-qpa-plugins \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libglu1-mesa-dev \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev libxrandr-dev \
            libxss-dev libxtst-dev libxinerama-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev wayland-protocols libwayland-egl-backend-dev libdecor-0-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libudev-dev libusb-1.0-0-dev \
            libdbus-1-dev libibus-1.0-dev libdrm-dev libgbm-dev zsync

      - name: Refresh the offline Amiibo catalogue
        uses: ./.github/actions/update-amiibo-catalog

      - name: Cache SDL3 static
        id: cache-sdl3
        uses: actions/cache@v5
        with:
          path: ~/.local/sdl3-static
          key: sdl3-linux-static-${{ env.SDL_REF }}-v3

      - name: Build SDL3 static
        if: steps.cache-sdl3.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$SDL_REF" https://github.com/libsdl-org/SDL.git /tmp/SDL3
          cmake -S /tmp/SDL3 -B /tmp/SDL3-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_INSTALL_PREFIX="$HOME/.local/sdl3-static" \
            -DSDL_SHARED=OFF \
            -DSDL_STATIC=ON \
            -DSDL_TEST_LIBRARY=OFF \
            -DSDL_TESTS=OFF \
            -DSDL_EXAMPLES=OFF
          cmake --build /tmp/SDL3-build --parallel
          cmake --install /tmp/SDL3-build

      - name: Build client
        run: |
          cmake -S client -B client/build -G Ninja \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$HOME/.local/sdl3-static"
          cmake --build client/build --parallel

      - name: Build AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp client/build/ns-client AppDir/usr/bin/ns-client
          chmod +x AppDir/usr/bin/ns-client
          cp client/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/ns-client.png
          cp client/icon.png AppDir/.DirIcon
          cp client/icon.png AppDir/usr/bin/icon.png

          cat > AppDir/usr/share/applications/ns-client.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=NS Client
          Exec=ns-client
          Icon=ns-client
          Categories=Game;Utility;
          Terminal=false
          EOF

          cp AppDir/usr/share/applications/ns-client.desktop AppDir/ns-client.desktop
          desktop-file-validate AppDir/usr/share/applications/ns-client.desktop

          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE=qmake6
          export OUTPUT=ns-client-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin qt \
            --output appimage

          mkdir -p client/artifacts/linux
          mv ns-client-x86_64.AppImage client/artifacts/linux/

      - uses: actions/upload-artifact@v6
        with:
          name: linux-appimage
          path: client/artifacts/linux/ns-client-x86_64.AppImage

  build-macos:
    name: macOS .app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Verify or install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          command -v cmake >/dev/null 2>&1 || missing+=(cmake)
          command -v ninja >/dev/null 2>&1 || missing+=(ninja)
          command -v pkg-config >/dev/null 2>&1 || missing+=(pkg-config)
          pkg-config --exists openssl || missing+=(openssl@3)
          if ((${#missing[@]})); then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install "${missing[@]}"
          fi

      - name: Refresh the offline Amiibo catalogue
        uses: ./.github/actions/update-amiibo-catalog

      - name: Cache SDL3 static
        id: cache-sdl3
        uses: actions/cache@v5
        with:
          path: ~/.local/sdl3-static
          key: sdl3-macos-static-${{ env.SDL_REF }}-v3

      - name: Build SDL3 static
        if: steps.cache-sdl3.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$SDL_REF" https://github.com/libsdl-org/SDL.git /tmp/SDL3
          cmake -S /tmp/SDL3 -B /tmp/SDL3-build -G Ninja \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="14.0" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/.local/sdl3-static" \
            -DSDL_SHARED=OFF \
            -DSDL_STATIC=ON \
            -DSDL_TEST_LIBRARY=OFF \
            -DSDL_TESTS=OFF \
            -DSDL_EXAMPLES=OFF
          cmake --build /tmp/SDL3-build --parallel
          cmake --install /tmp/SDL3-build

      - name: Build client
        run: |
          cmake -S client -B client/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$HOME/.local/sdl3-static;$Qt6_DIR" \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          cmake --build client/build --parallel

      - name: Package macOS App
        run: |
          APP="client/build/ns-client.app"
          macdeployqt "$APP" -verbose=1

          mkdir -p client/artifacts/macos
          cd client/build
          zip -r ../artifacts/macos/ns-client-macos.zip ns-client.app

      - uses: actions/upload-artifact@v6
        with:
          name: macos-app-zip
          path: client/artifacts/macos/ns-client-macos.zip
