<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NS Touch Controls</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="css/mobile.css">
    <script src="js/bridge.js"></script>
</head>
<body>
    <div id="rotate-msg">Please rotate to landscape mode.</div>
    <div id="gamepad">
        <div id="statusDot"></div>
        <button id="btnConnect">Connect</button>
        <div id="btn-zl" class="edit-item btn-shoulder btn btn-map" data-btn="64"><span class="label">ZL</span></div>
        <div id="btn-l" class="edit-item btn-shoulder btn btn-map" data-btn="16"><span class="label">L</span></div>
        <div id="btn-zr" class="edit-item btn-shoulder btn btn-map" data-btn="128"><span class="label">ZR</span></div>
        <div id="btn-r" class="edit-item btn-shoulder btn btn-map" data-btn="32"><span class="label">R</span></div>
        <div id="btn-sl" class="edit-item btn-shoulder btn btn-extra" data-extra="16"><span class="label">SL</span></div>
        <div id="btn-sr" class="edit-item btn-shoulder btn btn-extra" data-extra="32"><span class="label">SR</span></div>
        <div id="btn-minus" class="edit-item btn-sys btn btn-map" data-btn="256"><span class="label">-</span></div>
        <div id="btn-plus" class="edit-item btn-sys btn btn-map" data-btn="512"><span class="label">+</span></div>
        <div id="btn-capture" class="edit-item btn-sys btn btn-map" data-btn="8192"><span class="label">O</span></div>
        <div id="btn-home" class="edit-item btn-sys btn btn-map" data-btn="4096"><span class="label">⌂</span></div>
        <div id="lstick" class="edit-item joystick"><div class="knob" id="lknob"></div></div>
        <div id="btn-ls" class="edit-item btn-sys btn btn-map" data-btn="1024"><span class="label">LS</span></div>
        <div id="dpad" class="edit-item cross">
            <div class="btn btn-circle up btn-dpad" data-dir="u"><span class="label">&#x25B2;&#xFE0E;</span></div><div class="btn btn-circle left btn-dpad" data-dir="l"><span class="label">&#x25C0;&#xFE0E;</span></div>
            <div class="btn btn-circle right btn-dpad" data-dir="r"><span class="label">&#x25B6;&#xFE0E;</span></div><div class="btn btn-circle down btn-dpad" data-dir="d"><span class="label">&#x25BC;&#xFE0E;</span></div>
        </div>
        <div id="abxy" class="edit-item cross">
            <div class="btn btn-circle up btn-map" data-btn="8"><span class="label">X</span></div><div class="btn btn-circle left btn-map" data-btn="1"><span class="label">Y</span></div>
            <div class="btn btn-circle right btn-map" data-btn="4"><span class="label">A</span></div><div class="btn btn-circle down btn-map" data-btn="2"><span class="label">B</span></div>
        </div>
        <div id="rstick" class="edit-item joystick"><div class="knob" id="rknob"></div></div>
        <div id="btn-rs" class="edit-item btn-sys btn btn-map" data-btn="2048"><span class="label">RS</span></div>
    </div>
    <script src="js/controller_layouts.js"></script>
    <script src="js/mobile.js"></script>
</body>
</html>
