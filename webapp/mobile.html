<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NS Touch Controls</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="css/mobile.css">
    <script src="js/bridge.js"></script>
</head>
<body>
    <div id="rotate-msg">Please rotate to landscape mode.</div>
    <div id="gamepad">
        <div id="statusDot"></div>
        <button id="btnConnect">Connect</button>
        <div id="btn-zl" class="edit-item btn-shoulder btn btn-map" data-btn="64">ZL</div>
        <div id="btn-l" class="edit-item btn-shoulder btn btn-map" data-btn="16">L</div>
        <div id="btn-zr" class="edit-item btn-shoulder btn btn-map" data-btn="128">ZR</div>
        <div id="btn-r" class="edit-item btn-shoulder btn btn-map" data-btn="32">R</div>
        <div id="btn-minus" class="edit-item btn-sys btn btn-map" data-btn="256">-</div>
        <div id="btn-plus" class="edit-item btn-sys btn btn-map" data-btn="512">+</div>
        <div id="btn-capture" class="edit-item btn-sys btn btn-map" data-btn="8192">O</div>
        <div id="btn-home" class="edit-item btn-sys btn btn-map" data-btn="4096">⌂</div>
        <div id="lstick" class="edit-item joystick"><div class="knob" id="lknob"></div></div>
        <div id="btn-ls" class="edit-item btn-sys btn btn-map" data-btn="1024">LS</div>
        <div id="dpad" class="edit-item cross">
            <div class="btn btn-circle up btn-dpad" data-dir="u">&#x25B2;&#xFE0E;</div><div class="btn btn-circle left btn-dpad" data-dir="l">&#x25C0;&#xFE0E;</div>
            <div class="btn btn-circle right btn-dpad" data-dir="r">&#x25B6;&#xFE0E;</div><div class="btn btn-circle down btn-dpad" data-dir="d">&#x25BC;&#xFE0E;</div>
        </div>
        <div id="abxy" class="edit-item cross">
            <div class="btn btn-circle up btn-map" data-btn="8">X</div><div class="btn btn-circle left btn-map" data-btn="1">Y</div>
            <div class="btn btn-circle right btn-map" data-btn="4">A</div><div class="btn btn-circle down btn-map" data-btn="2">B</div>
        </div>
        <div id="rstick" class="edit-item joystick"><div class="knob" id="rknob"></div></div>
        <div id="btn-rs" class="edit-item btn-sys btn btn-map" data-btn="2048">RS</div>
    </div>
    <script src="js/mobile.js"></script>
</body>
</html>
