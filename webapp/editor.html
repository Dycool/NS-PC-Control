<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NS Layout Editor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231E1E1E'/%3E%3Ccircle cx='22' cy='40' r='9' fill='%23CC0000'/%3E%3Ccircle cx='42' cy='24' r='9' fill='%23E0E0E0'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/editor.css">
    <script src="js/bridge.js"></script>
</head>
<body>
    <div id="rotate-msg">Please rotate to landscape mode.</div>
    <div id="gamepad">
        <div id="menu-toggle" onclick="toggleMenu()" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:50px; height:50px; background:rgba(255,255,255,0.2); border-radius:50%; display:none; justify-content:center; align-items:center; z-index:9999; font-size:24px; box-shadow: 0 0 10px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.5);">⚙️</div>
        <div id="editor-bar">
            <div id="eb-header" style="padding: 10px; background: #333; border-radius: 12px 12px 0 0; display: flex; justify-content: space-between; align-items: center; cursor: move;">
                <span style="font-weight:bold; font-size:14px; color: white;">Editor Settings</span>
                <button onclick="toggleMenu()" style="background:none; border:none; color:white; font-size:22px; padding:10px; margin-right:-5px; cursor:pointer; line-height:1;">❌</button>
            </div>
            <div style="padding: 15px; display: flex; flex-direction: column; gap: 10px;">
                <div style="color:#fff; text-align:center; font-size:14px; margin-bottom:5px;">Drag to Move, Pinch to Resize</div>
                <label for="controllerType" style="color:#fff;font-size:13px;">Emulated controller</label>
                <select id="controllerType" onchange="changeControllerType()">
                    <option value="3">Pro Controller</option>
                    <option value="1">Joy-Con (L)</option>
                    <option value="2">Joy-Con (R)</option>
                </select>
                <button onclick="saveLayout()" style="background:#CC0000; color:#fff;">Save</button>
                <select id="addSel" onchange="addBtn()"><option value="">+ Add Button</option></select>
                <button id="toggleDel" onclick="toggleDel()">🗑️ Delete Mode: OFF</button>
                <button onclick="window.location.href='mobile.html'" style="background:#262626; color:#E0E0E0; border:1px solid #3A3A3A;">Cancel</button>
                <button onclick="resetLayout()" style="background:#262626; color:#E0E0E0; border:1px solid #CC0000;">Reset to Defaults</button>
            </div>
        </div>
        <div id="btn-zl" class="edit-item btn-shoulder btn"><span class="label">ZL</span></div>
        <div id="btn-l" class="edit-item btn-shoulder btn"><span class="label">L</span></div>
        <div id="btn-zr" class="edit-item btn-shoulder btn"><span class="label">ZR</span></div>
        <div id="btn-r" class="edit-item btn-shoulder btn"><span class="label">R</span></div>
        <div id="btn-sl" class="edit-item btn-shoulder btn"><span class="label">SL</span></div>
        <div id="btn-sr" class="edit-item btn-shoulder btn"><span class="label">SR</span></div>
        <div id="btn-minus" class="edit-item btn-sys btn"><span class="label">-</span></div>
        <div id="btn-plus" class="edit-item btn-sys btn"><span class="label">+</span></div>
        <div id="btn-capture" class="edit-item btn-sys btn"><span class="label">O</span></div>
        <div id="btn-home" class="edit-item btn-sys btn"><span class="label">⌂</span></div>
        <div id="lstick" class="edit-item joystick"><div class="knob"></div></div>
        <div id="btn-ls" class="edit-item btn-sys btn"><span class="label">LS</span></div>
        <div id="dpad" class="edit-item cross">
            <div class="btn btn-circle up"><span class="label">&#x25B2;&#xFE0E;</span></div><div class="btn btn-circle left"><span class="label">&#x25C0;&#xFE0E;</span></div>
            <div class="btn btn-circle right"><span class="label">&#x25B6;&#xFE0E;</span></div><div class="btn btn-circle down"><span class="label">&#x25BC;&#xFE0E;</span></div>
        </div>
        <div id="abxy" class="edit-item cross">
            <div class="btn btn-circle up"><span class="label">X</span></div><div class="btn btn-circle left"><span class="label">Y</span></div>
            <div class="btn btn-circle right"><span class="label">A</span></div><div class="btn btn-circle down"><span class="label">B</span></div>
        </div>
        <div id="rstick" class="edit-item joystick"><div class="knob"></div></div>
        <div id="btn-rs" class="edit-item btn-sys btn"><span class="label">RS</span></div>
    </div>
    <script src="js/controller_layouts.js"></script>
    <script src="js/editor.js"></script>
</body>
</html>
